name: 🎙️ Podcast quotidien

on:
  schedule:
    # 8h20 heure de Paris toute l'année : 6h20 UTC (été, CEST) et 7h20 UTC (hiver, CET).
    # Les deux crons se déclenchent ; le job check-hour ne laisse passer que
    # celui qui correspond réellement à 8h à Paris.
    - cron: '20 6 * * *'
    - cron: '20 7 * * *'
  workflow_dispatch:   # bouton "Run workflow" pour lancer à la main

# Autorise le workflow à commit/push les nouveaux épisodes
permissions:
  contents: write

# Empêche deux exécutions simultanées
concurrency:
  group: podcast-daily
  cancel-in-progress: false

jobs:
  check-hour:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.paris.outputs.go }}
    steps:
      - name: Est-il 8h à Paris ?
        id: paris
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/Paris date +%H)" = "08" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "🟡 Pas 8h à Paris — run ignoré (l'autre cron s'en chargera)."
          fi

  build:
    needs: check-hour
    if: needs.check-hour.outputs.go == 'true'
    runs-on: ubuntu-latest

    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-5-sonnet-20241022' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'elevenlabs' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'ZfzastaCQOj8iuzFZuWy' }}
      ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_multilingual_v2' }}
      EDGE_VOICE: ${{ vars.EDGE_VOICE || 'fr-FR-HenriNeural' }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer l'épisode du jour
        run: python generate_podcast.py

      - name: Mettre à jour le flux RSS
        run: python update_rss.py

      - name: Commit et push du nouvel épisode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcasts/*.mp3 scripts/*.txt rss.xml script_hier.txt script_today.txt
          if git diff --staged --quiet; then
            echo "🟡 Aucun nouvel épisode aujourd'hui — rien à publier."
          else
            git commit -m "🎙️ Épisode du $(date -u +'%d-%m-%Y')"
            git push
            echo "✅ Épisode publié."
          fi
